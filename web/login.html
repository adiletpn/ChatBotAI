<!doctype html>
<html lang="kk">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mind AI — Кіру</title>
  <link rel="icon" href="/static/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/static/fonts/fonts.css">
  <link rel="stylesheet" href="/static/style.css">
  <script>
    try { const s = JSON.parse(localStorage.getItem("mind_prefs") || "{}"); if (s.theme && s.theme !== "system") document.documentElement.dataset.theme = s.theme; } catch (_) {}
  </script>
  <style>
    body { overflow: auto; }
    .auth { position: relative; z-index: 1; display: grid; grid-template-columns: minmax(400px, 1fr) 1.1fr; min-height: 100vh; min-height: 100dvh; }
    .auth-form { display: flex; flex-direction: column; padding: 28px 36px; }
    .auth-top { display: flex; align-items: center; justify-content: space-between; }
    .auth-brand { display: flex; align-items: center; gap: 10px; }
    .auth-brand img { width: 34px; height: 34px; }
    .lang-mini { display: flex; gap: 2px; padding: 3px; border-radius: 12px; background: var(--glass); backdrop-filter: blur(14px); border: 1px solid var(--border); }
    .lang-mini button { border: 0; background: none; padding: 4px 9px; border-radius: 9px; font-size: 12px; font-weight: 600; color: var(--faint); }
    .lang-mini button.active { background: var(--solid); color: var(--text); box-shadow: var(--shadow); }
    .auth-box { width: 100%; max-width: 400px; margin: auto; padding: 28px 0; animation: rise .4s ease both; }
    .auth-box h1 { font-family: var(--display); font-weight: 700; font-size: 34px; letter-spacing: -.035em; line-height: 1.12; margin: 0 0 8px; }
    .auth-box .sub { color: var(--muted); margin: 0 0 26px; }
    .auth-box .sub b { color: var(--text); font-weight: 600; }
    .switch-mode { display: flex; gap: 2px; background: var(--panel-2); border: 1px solid var(--border); border-radius: 13px; padding: 3px; margin-bottom: 22px; }
    .switch-mode button { flex: 1; border: 0; background: none; border-radius: 10px; padding: 8px; font-weight: 600; color: var(--muted); font-size: 14px; }
    .switch-mode button.active { background: var(--solid); color: var(--text); box-shadow: var(--shadow); }
    .pw-wrap { position: relative; }
    .pw-wrap .eye { position: absolute; right: 6px; top: 50%; transform: translateY(-50%); border: 0; background: none; color: var(--faint); font-size: 12px; font-weight: 600; padding: 6px 8px; border-radius: 8px; }
    .pw-wrap .eye:hover { color: var(--text); background: var(--hover); }
    .meter { display: flex; gap: 4px; margin-top: 8px; }
    .meter i { flex: 1; height: 4px; border-radius: 99px; background: var(--panel-2); transition: background .2s; }
    .meter[data-s="1"] i:nth-child(-n+1) { background: var(--bad); }
    .meter[data-s="2"] i:nth-child(-n+2) { background: var(--warn); }
    .meter[data-s="3"] i:nth-child(-n+3) { background: #5b8cff; }
    .meter[data-s="4"] i { background: var(--ok); }
    .rules { list-style: none; padding: 0; margin: 8px 0 0; display: flex; flex-wrap: wrap; gap: 4px 14px; font-size: 12.5px; color: var(--faint); }
    .rules li::before { content: "○ "; }
    .rules li.ok { color: var(--ok); }
    .rules li.ok::before { content: "● "; }
    .msg-box { border-radius: 12px; padding: 10px 12px; font-size: 13.5px; margin-bottom: 14px; }
    .msg-box.err { color: var(--bad); background: var(--bad-soft); }
    .msg-box.info { color: var(--text); background: var(--accent-soft); }
    .msg-box[hidden], .field[hidden], [hidden] { display: none !important; }
    .primary { width: 100%; margin-top: 6px; padding: 12px; font-size: 15px; }
    .link { border: 0; background: none; color: var(--accent); font-weight: 600; font-size: 13.5px; padding: 0; }
    .link:hover { text-decoration: underline; }
    .link:disabled { color: var(--faint); text-decoration: none; cursor: default; }
    .row-between { display: flex; justify-content: flex-end; margin: -4px 0 14px; }
    .or { display: flex; align-items: center; gap: 12px; color: var(--faint); font-size: 12.5px; margin: 20px 0; }
    .or::before, .or::after { content: ""; flex: 1; height: 1px; background: var(--border); }
    .guest { width: 100%; padding: 11px; }
    .fine { color: var(--faint); font-size: 12px; text-align: center; margin-top: 18px; }
    .code-boxes { display: flex; gap: 8px; justify-content: space-between; margin: 4px 0 16px; }
    .code-boxes input { width: 100%; max-width: 56px; height: 62px; text-align: center; font-family: var(--display); font-size: 24px; font-weight: 700; border-radius: 14px; padding: 0; }
    .back { margin-top: 16px; text-align: center; }

    .auth-art { position: relative; margin: 12px 12px 12px 0; border-radius: 28px; overflow: hidden; display: flex; flex-direction: column; justify-content: center; padding: 56px; background: var(--glass); backdrop-filter: blur(24px) saturate(150%); -webkit-backdrop-filter: blur(24px) saturate(150%); border: 1px solid var(--border); }
    .auth-art::before { content: ""; position: absolute; width: 420px; height: 420px; right: -120px; top: -120px; border-radius: 50%; background: var(--blob-1); filter: blur(70px); }
    .auth-art::after { content: ""; position: absolute; width: 380px; height: 380px; left: -100px; bottom: -140px; border-radius: 50%; background: var(--blob-2); filter: blur(70px); }
    .art-inner { max-width: 520px; position: relative; z-index: 1; }
    .art-quote { font-family: var(--display); font-weight: 700; font-size: 38px; line-height: 1.12; letter-spacing: -.035em; margin: 0 0 30px; }
    .art-quote em { font-style: normal; background: var(--grad); -webkit-background-clip: text; background-clip: text; color: transparent; }
    .art-demo { background: var(--glass-strong); border: 1px solid var(--border); border-radius: 20px; padding: 18px; box-shadow: var(--shadow-lg); font-size: 14px; }
    .art-q { background: var(--grad); color: #fff; border-radius: 14px 14px 4px 14px; padding: 8px 12px; margin-left: auto; width: fit-content; max-width: 85%; margin-bottom: 12px; }
    .art-a { display: flex; gap: 10px; }
    .art-a img { width: 26px; height: 26px; flex: none; margin-top: 1px; }
    .art-a mark { background: var(--mark); color: var(--text); border-radius: 4px; padding: 0 3px; }
    .art-src { display: inline-flex; gap: 6px; align-items: center; margin-top: 10px; border: 1px solid var(--border); border-radius: 9px; padding: 3px 9px; font-size: 12px; color: var(--muted); }
    .art-src b { color: var(--accent); }
    .art-list { list-style: none; padding: 0; margin: 28px 0 0; display: grid; grid-template-columns: 1fr 1fr; gap: 12px; color: var(--muted); font-size: 14px; }
    .art-list li { display: flex; gap: 10px; align-items: center; }
    .art-list svg { color: var(--accent); }
    @media (max-width: 900px) {
      .auth { grid-template-columns: 1fr; }
      .auth-art { display: none; }
      .auth-form { padding: 18px; }
      .auth-box h1 { font-size: 28px; }
    }
  </style>
</head>

<div class="aurora" aria-hidden="true"><span></span><span></span><span></span></div>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="i-pin" viewBox="0 0 24 24"><path class="ico" d="M12 21s-6-5.6-6-11a6 6 0 0 1 12 0c0 5.4-6 11-6 11z"/><circle class="ico" cx="12" cy="10" r="2.2"/></symbol>
  <symbol id="i-globe" viewBox="0 0 24 24"><circle class="ico" cx="12" cy="12" r="9"/><path class="ico" d="M3 12h18M12 3c2.5 2.6 3.7 5.6 3.7 9s-1.2 6.4-3.7 9c-2.5-2.6-3.7-5.6-3.7-9S9.5 5.6 12 3z"/></symbol>
  <symbol id="i-quiz" viewBox="0 0 24 24"><path class="ico" d="m2.5 9 9.5-5 9.5 5-9.5 5zM6.5 11.2V16c3 2.2 8 2.2 11 0v-4.8M21.5 9v5"/></symbol>
  <symbol id="i-scan" viewBox="0 0 24 24"><path class="ico" d="M4 8V5a1 1 0 0 1 1-1h3M16 4h3a1 1 0 0 1 1 1v3M20 16v3a1 1 0 0 1-1 1h-3M8 20H5a1 1 0 0 1-1-1v-3M7 12h10"/></symbol>
</svg>

<div class="auth">
  <section class="auth-form">
    <div class="auth-top">

      <div id="paneMain">

          <button type="button" data-mode="register" data-t="register"></button>
        </div>
        <form id="mainForm" novalidate>
          <div class="field" id="nameField"><label for="name" data-t="name"></label><input class="input" id="name" autocomplete="name" maxlength="60"></div>
          <div class="field"><label for="email" data-t="email"></label><input class="input" id="email" type="email" autocomplete="email" autocapitalize="off" spellcheck="false" maxlength="120"></div>
          <div class="field">
            <label for="password" data-t="password"></label>
            <div class="pw-wrap"><input class="input" id="password" type="password" maxlength="128"><button type="button" class="eye" data-eye="password"></button></div>
            <div id="pwHelp"><div class="meter" id="meter"><i></i><i></i><i></i><i></i></div>
              <ul class="rules"><li data-rule="len" data-t="r_len"></li><li data-rule="letter" data-t="r_letter"></li><li data-rule="digit" data-t="r_digit"></li></ul></div>
          </div>
          <div class="field" id="confirmField"><label for="password2" data-t="password2"></label><input class="input" id="password2" type="password" autocomplete="new-password" maxlength="128"></div>
          <div class="row-between" id="forgotRow"><button type="button" class="link" id="forgotLink" data-t="forgot"></button></div>
          <div class="msg-box err" id="mainErr" hidden></div>
          <button class="btn primary" id="mainSubmit" type="submit"></button>
        </form>
        <div class="or" data-t="or"></div>
        <button class="btn ghost guest" id="guest" type="button" data-t="guest"></button>
        <p class="fine" data-t="fine"></p>
      </div>

      <div id="paneCode" hidden>
        <h1 id="codeTitle"></h1>
        <p class="sub" id="codeSub"></p>
        <form id="codeForm" novalidate>
          <div class="code-boxes" id="codeBoxes">
            <input class="input" inputmode="numeric" maxlength="1" autocomplete="one-time-code"><input class="input" inputmode="numeric" maxlength="1"><input class="input" inputmode="numeric" maxlength="1"><input class="input" inputmode="numeric" maxlength="1"><input class="input" inputmode="numeric" maxlength="1"><input class="input" inputmode="numeric" maxlength="1">
          </div>
          <div class="field" id="newPwField">
            <label for="newPassword" data-t="new_password"></label>
            <div class="pw-wrap"><input class="input" id="newPassword" type="password" autocomplete="new-password" maxlength="128"><button type="button" class="eye" data-eye="newPassword"></button></div>
            <div class="meter" id="meter2"><i></i><i></i><i></i><i></i></div>
          </div>
          <div class="msg-box info" id="codeInfo" hidden></div>
          <div class="msg-box err" id="codeErr" hidden></div>
          <button class="btn primary" id="codeSubmit" type="submit"></button>
        </form>
        <div class="back"><button type="button" class="link" id="resend"></button></div>
        <div class="back"><button type="button" class="link" id="backLink" data-t="back"></button></div>
      </div>

      <div id="paneForgot" hidden>
        <h1 data-t="forgot_title"></h1>
        <p class="sub" data-t="forgot_sub"></p>
        <form id="forgotForm" novalidate>
          <div class="field"><label for="forgotEmail" data-t="email"></label><input class="input" id="forgotEmail" type="email" autocomplete="email" maxlength="120"></div>
          <div class="msg-box err" id="forgotErr" hidden></div>
          <button class="btn primary" type="submit" data-t="send_code"></button>
        </form>
        <div class="back"><button type="button" class="link" id="forgotBack" data-t="back"></button></div>
      </div>
    </div>
  </section>

  <section class="auth-art">
    <div class="art-inner">
      <p class="art-quote" data-t="quote"></p>
      <div class="art-demo">
        <div class="art-q" data-t="demo_q"></div>
        <div class="art-a"><img src="/static/favicon.svg" alt=""><div><span data-t="demo_a"></span>
          <div class="art-src"><svg width="14" height="14"><use href="#i-pin"/></svg><span data-t="demo_src"></span></div></div></div>
      </div>
      <ul class="art-list">
        <li><svg><use href="#i-pin"/></svg><span data-t="li1"></span></li>
        <li><svg><use href="#i-globe"/></svg><span data-t="li2"></span></li>
        <li><svg><use href="#i-scan"/></svg><span data-t="li3"></span></li>
        <li><svg><use href="#i-quiz"/></svg><span data-t="li4"></span></li>
      </ul>
    </div>
  </section>
</div>

    err_invalid: "Wrong email or password.", err_email_invalid: "Invalid email.", err_email_disposable: "Disposable email services are not allowed.",
    err_email_taken: "This email is already registered. Sign in or reset your password.", err_name_invalid: "Enter your name.",
    err_password_short: "Password must be at least 8 characters.", err_password_weak: "Password must contain letters and digits.",
    err_mismatch: "Passwords do not match.", err_locked: "Too many failed attempts. Try again in 15 minutes.",
    err_too_many: "Too many requests. Try again later.", err_wait: "You can request a new code in a minute.",
    err_code_invalid: "Wrong code.", err_code_expired: "The code has expired — request a new one.",
    err_mail_failed: "Could not send the email. Try again later.", err_empty: "Please fill in all fields.", err_net: "Could not reach the server.",
  },
};
const $ = (s) => document.querySelector(s);
let lang = "kk", mode = "login", codeKind = "verify", codeEmail = "", cooldown = 0, timer = null;
try {
  const nav = navigator.language || "";
  lang = localStorage.getItem("mind_lang") || (nav.startsWith("ru") ? "ru" : nav.startsWith("en") ? "en" : "kk");
} catch (_) {}
if (!T[lang]) lang = "kk";
const t = (k) => T[lang][k] ?? T.ru[k] ?? k;
const has = (k) => k in T[lang] || k in T.ru;

function show(pane) {
  for (const id of ["paneMain", "paneCode", "paneForgot"]) $("#" + id).hidden = id !== pane;
  document.querySelectorAll(".msg-box").forEach((el) => (el.hidden = true));
  const first = $("#" + pane).querySelector("input");
  if (first) setTimeout(() => first.focus(), 30);
}

function render() {
  document.documentElement.lang = lang;
  document.querySelectorAll("[data-t]").forEach((el) => (el.innerHTML = t(el.dataset.t)));
  document.querySelectorAll("[data-eye]").forEach((b) => (b.textContent = $("#" + b.dataset.eye).type === "password" ? t("show") : t("hide")));
  const reg = mode === "register";
  $("#mainTitle").textContent = t(reg ? "register_title" : "login_title");
  $("#mainSub").textContent = t(reg ? "register_sub" : "login_sub");
  $("#mainSubmit").textContent = t(reg ? "submit_register" : "submit_login");
  $("#nameField").hidden = $("#confirmField").hidden = $("#pwHelp").hidden = !reg;
  $("#forgotRow").hidden = reg;
  $("#password").autocomplete = reg ? "new-password" : "current-password";
  $("#codeTitle").textContent = t(codeKind === "reset" ? "reset_title" : "code_title");
  $("#codeSub").innerHTML = `${t(codeKind === "reset" ? "reset_sub" : "code_sub")} <b>${codeEmail.replace(/</g, "&lt;")}</b>`;
  $("#codeSubmit").textContent = t(codeKind === "reset" ? "reset_btn" : "verify");
  $("#newPwField").hidden = codeKind !== "reset";
  $("#resend").textContent = cooldown > 0 ? t("resend_in").replace("{s}", cooldown) : t("resend");
  $("#resend").disabled = cooldown > 0;
  document.querySelectorAll("#langSwitch button").forEach((b) => b.classList.toggle("active", b.dataset.lang === lang));
  document.querySelectorAll("#modeSwitch button").forEach((b) => b.classList.toggle("active", b.dataset.mode === mode));
}

// надёжность пароля: длина, буквы, цифры, разнообразие
function strength(pw) {
  const rules = { len: pw.length >= 8, letter: /\p{L}/u.test(pw), digit: /\d/.test(pw) };
  let score = Object.values(rules).filter(Boolean).length;
  if (score === 3 && (pw.length >= 12 || /[^\p{L}\d]/u.test(pw))) score = 4;
  return { rules, score: pw ? Math.max(1, score) : 0 };
}

function err(box, key) {
  box.textContent = has("err_" + key) ? t("err_" + key) : t("err_invalid");
  box.hidden = false;
}

async function post(url, body) {
  const res = await fetch(url, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body || {}) });
  let data = {};
  try { data = await res.json(); } catch (_) {}
  return { ok: res.ok, data, code: typeof data.detail === "string" ? data.detail : "invalid" };
}

function startCooldown() {
  cooldown = 60;
  clearInterval(timer);
  timer = setInterval(() => { cooldown -= 1; if (cooldown <= 0) clearInterval(timer); render(); }, 1000);
  render();
}

function openCode(kind, email, mail) {
  codeKind = kind;
  codeEmail = email;
  boxes.forEach((i) => (i.value = ""));
  $("#newPassword").value = "";
  render();
  show("paneCode");
  if (mail === "console") { $("#codeInfo").textContent = t("console_note"); $("#codeInfo").hidden = false; }
  startCooldown();
}

function busy(on) { document.querySelectorAll("button[type=submit], #guest").forEach((b) => (b.disabled = on)); }

// ---------- вход / регистрация
$("#mainForm").onsubmit = async (e) => {
  e.preventDefault();
  const box = $("#mainErr");
  box.hidden = true;
  const email = $("#email").value.trim(), password = $("#password").value;
  if (!email || !password || (mode === "register" && !$("#name").value.trim())) return err(box, "empty");
  if (mode === "register") {
    const s = strength(password);
    if (!s.rules.len) return err(box, "password_short");
    if (!s.rules.letter || !s.rules.digit) return err(box, "password_weak");
    if (password !== $("#password2").value) return err(box, "mismatch");
  }
  busy(true);
  try {
    if (mode === "register") {
      const r = await post("/api/auth/register", { name: $("#name").value.trim(), email, password, lang });
      if (r.ok) return openCode("verify", r.data.email, r.data.mail);
      err(box, r.code);
    } else {
      const r = await post("/api/auth/login", { email, password });
      if (r.ok) { location.href = "/"; return; }
      if (r.code === "not_verified") {
        const s = await post("/api/auth/send-code", { email, kind: "verify", lang });
        return openCode("verify", email, s.data.mail);
      }
      err(box, r.code);
    }
  } catch (_) { err(box, "net"); } finally { busy(false); }
};

// ---------- код из 6 цифр
const boxes = [...document.querySelectorAll("#codeBoxes input")];
boxes.forEach((input, i) => {
  input.addEventListener("input", () => {
    input.value = input.value.replace(/\D/g, "").slice(-1);
    if (input.value && boxes[i + 1]) boxes[i + 1].focus();
    if (boxes.every((b) => b.value) && codeKind === "verify") $("#codeForm").requestSubmit();
  });
  input.addEventListener("keydown", (e) => { if (e.key === "Backspace" && !input.value && boxes[i - 1]) boxes[i - 1].focus(); });
  input.addEventListener("paste", (e) => {
    const digits = (e.clipboardData.getData("text") || "").replace(/\D/g, "").slice(0, 6);
    if (!digits) return;
    e.preventDefault();
    digits.split("").forEach((d, k) => { if (boxes[k]) boxes[k].value = d; });
    (boxes[digits.length] || boxes[5]).focus();
    if (digits.length === 6 && codeKind === "verify") $("#codeForm").requestSubmit();
  });
});

$("#codeForm").onsubmit = async (e) => {
  e.preventDefault();
  const box = $("#codeErr");
  box.hidden = true;
  const code = boxes.map((b) => b.value).join("");
  if (code.length !== 6) return err(box, "code_invalid");
  let r;
  if (codeKind === "reset") {
    const pw = $("#newPassword").value, s = strength(pw);
    if (!s.rules.len) return err(box, "password_short");
    if (!s.rules.letter || !s.rules.digit) return err(box, "password_weak");
    busy(true);
    r = await post("/api/auth/reset", { email: codeEmail, code, password: pw }).catch(() => ({ code: "net" }));
  } else {
    busy(true);
    r = await post("/api/auth/verify", { email: codeEmail, code }).catch(() => ({ code: "net" }));
  }
  busy(false);
  if (r.ok) { location.href = "/"; return; }
  err(box, r.code);
};

$("#resend").onclick = async () => {
  const r = await post("/api/auth/send-code", { email: codeEmail, kind: codeKind, lang }).catch(() => ({ code: "net" }));
  if (r.ok) { $("#codeInfo").textContent = t("sent"); $("#codeInfo").hidden = false; startCooldown(); }
  else err($("#codeErr"), r.code);
};

// ---------- забыли пароль
$("#forgotLink").onclick = () => { $("#forgotEmail").value = $("#email").value; show("paneForgot"); };
$("#forgotForm").onsubmit = async (e) => {
  e.preventDefault();
  const email = $("#forgotEmail").value.trim();
  if (!email) return err($("#forgotErr"), "empty");
  busy(true);
  const r = await post("/api/auth/send-code", { email, kind: "reset", lang }).catch(() => ({ code: "net" }));
  busy(false);
  if (!r.ok) return err($("#forgotErr"), r.code);
  openCode("reset", email, r.data.mail);  // ответ одинаковый, даже если такого email нет
};

// ---------- прочее
$("#guest").onclick = async () => {
  busy(true);
  const r = await post("/api/auth/guest").catch(() => ({ code: "net" }));
  if (r.ok) { location.href = "/"; return; }
  err($("#mainErr"), r.code);
  busy(false);
};
$("#password").addEventListener("input", () => {
  const s = strength($("#password").value);
  $("#meter").dataset.s = s.score;
  document.querySelectorAll("[data-rule]").forEach((li) => li.classList.toggle("ok", s.rules[li.dataset.rule]));
});
$("#newPassword").addEventListener("input", () => { $("#meter2").dataset.s = strength($("#newPassword").value).score; });
document.querySelectorAll("[data-eye]").forEach((b) => (b.onclick = () => {
  const input = $("#" + b.dataset.eye);
  input.type = input.type === "password" ? "text" : "password";
  render();
}));
$("#backLink").onclick = () => show(codeKind === "reset" ? "paneForgot" : "paneMain");
$("#forgotBack").onclick = () => show("paneMain");
$("#langSwitch").onclick = (e) => {
  if (!e.target.dataset.lang) return;
  lang = e.target.dataset.lang;
  try { localStorage.setItem("mind_lang", lang); } catch (_) {}
  render();
};
$("#modeSwitch").onclick = (e) => {
  if (!e.target.dataset.mode) return;
  mode = e.target.dataset.mode;
  $("#mainErr").hidden = true;
  render();
};
render();
show("paneMain");
</script>
</body>
</html>
